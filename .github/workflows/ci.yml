name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule un run en cours si un nouveau commit arrive sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Les apps consomment le build de @techshop/shared
      - run: npm run build -w @techshop/shared

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Build des images Docker
    runs-on: ubuntu-latest
    needs: quality
    env:
      SEED_ADMIN_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      # Test de fumée : la pile démarre et l'API répond à travers nginx
      - run: docker compose up -d --wait --wait-timeout 120
      - run: curl -fsS http://localhost:8080/api/health
      - if: failure()
        run: docker compose logs
